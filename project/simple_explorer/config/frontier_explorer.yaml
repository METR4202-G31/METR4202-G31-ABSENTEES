frontier_explorer:
  ros__parameters:
    # Frontier detection and scoring
    min_cluster_size: 10         # cells (0.5 m at 0.05 m/cell). Was 20, which silently dropped the
                                 # frontier across a 0.65 m corridor (~13 cells). Specks are now
                                 # filtered by min_gain instead.
    min_goal_distance: 0.6       # m; never pick a goal closer to the robot than this
    revisit_radius: 0.25          # m; do not re-pick goals near recently visited ones
    max_history: 20
    distance_weight: 1.0         # score per metre of driving distance
    size_weight: 0.0             # score per frontier cell. Was 0.1, but frontier length is a poor
                                 # guide: the ring around an unmapped speck is long, a corridor
                                 # opening is short. Replaced by gain_weight below.
    cost_limit: 75               # Nav2 cost above which a goal is too close to an obstacle
    travel_clearance: 0.18       # m; walls are grown by this when judging reachability.
                                 # Keep equal to robot_radius in nav2_params.yaml: it was
                                 # 0.15 against Nav2's 0.22, so the explorer kept picking
                                 # frontiers the planner then refused.

    # Information gain and turn penalty. For the original behaviour set gain_weight,
    # min_gain and turn_weight to 0.0, min_cluster_size to 20 and size_weight to 0.1.
    gain_weight: 1.0             # score per m^2 of unknown space behind a frontier
    min_gain: 0.25               # m^2; frontiers hiding less (unmapped specks) are ignored
    gain_radius: 3.0             # m; how far the flood fill into unknown space reaches
    max_gain_area: 2.0           # m^2; gain cap, so any "real" frontier scores about the same
                                 # and distance/turning decide between them (no cross-map trips)
    turn_weight: 0.5             # score per radian of turning: going straight back costs ~1.6 m

    # Blacklist (goals Nav2 actually failed to reach) and deferred goals
    blacklist_radius: 0.25        # m; circle around goals that failed in Nav2
    defer_radius: 0.3            # m; circle around goals the planner pre-check refused.
                                 # Deferred goals are retried after the robot moves or spins.
    min_failure_count: 1         # supervisor failed regions with fewer failures are ignored

    # Frames
    map_frame: map
    robot_frame: base_footprint

    # Nav2 / supervisor interfaces
    managed_navigate_action: managed_navigate
    compute_path_action: compute_path_to_pose
    precheck_path: true          # ask the planner for a path before sending a goal
    max_prechecks: 5             # planner pre-check failures in a row before pausing settle_time;
                                 # after each failure the frontiers are re-ranked
    precheck_timeout: 3.0        # s

    # Loop behaviour
    loop_rate_hz: 2.0
    settle_time: 1.0             # s pause after each goal so the map can update
    empty_cycles_to_finish: 3    # consecutive empty selections before reporting DONE_*
    validity_check_period: 2.0   # s between "is the frontier still there" checks
    frontier_gone_radius: 1.0    # m
    frontier_display_radius: 0.5 # m; minimum spacing between displayed frontier cells
    max_internal_retries: 2

    # Startup and recovery
    startup_delay: 2.0           # s to wait after Nav2 and the map are up before the first goal
    initial_spin: false          # turn on the spot once before the first goal. Off: SLAM
                                 # ignores turning on the spot and the lidar sees 360 deg, so it
                                 # only helps the camera, and costs ~16 s at 0.4 rad/s.
    spin_action: spin            # Nav2 behavior server action
    spin_angle: 6.28             # rad per spin (one full turn)
    spin_time_allowance: 20.0    # s
    max_recoveries: 2            # spins in a row with no reachable frontier before DONE_*

    # Goal placement and time limit
    goal_offset: 0.25            # m; goals sit this far back from the frontier edge, in known
                                 # free space (NavFn often fails on goals right at the edge)
    goal_timeout_base: 20.0      # s; a goal not reached within base + per_m * driving distance
    goal_timeout_per_m: 6.0      # s/m; is cancelled and blacklisted. Both 0 = no time limit.
    goal_heading: approach       # approach: goal faces the way the planned path arrives, so no
                                 # turn on the spot at the end. frontier: goal faces into the
                                 # unknown area (old behaviour; better for the camera, more turning)

    # Map-growth watchdog: after a goal is reached the map must grow, or the area
    # around that goal is skipped until it does (stops dithering if SLAM stalls)
    min_map_growth: 0.2          # m^2 of newly mapped area that counts as progress
    stale_radius: 0.75           # m; area skipped around a goal that added nothing
    progress_check_delay: 2.0    # s to wait for SLAM to publish before checking
    stale_warn_count: 2          # goals in a row without growth before warning about SLAM

    # A failed goal is not blacklisted if the robot never moved (it was stuck, not the goal)
    stuck_move_threshold: 0.25   # m; moving less than this during a goal counts as stuck
    max_stuck_passes: 1          # stuck failures in a row before blacklisting anyway
